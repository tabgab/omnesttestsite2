<header class="header sticky-top">
    <div class="container">
        <div class="header-inner">
            <a href="{{ site.baseurl }}/" class="navbar-brand">
                <img src="{{ site.baseurl }}/common/images/logo.png" alt="OMNEST" class="logo">
            </a>
            
            <div class="d-flex align-items-center">
                <div class="search-form mr-4 d-none d-md-block">
                    <form name="frmSearch" action="search" method="get" class="d-flex">
                        <input type="text" name="q" class="form-control form-control-sm" placeholder="Search..."/>
                        <button type="submit" class="btn btn-sm btn-primary ml-2">
                            <span class="sr-only">Search</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                            </svg>
                        </button>
                    </form>
                </div>
                
                <nav class="nav">
                    <button class="navbar-toggle" id="navToggle" aria-label="Toggle navigation">☰</button>
                    <ul class="navbar-nav" id="navMenu">
                        {% include top_menu.html menu=include.menu %}
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</header>

<div class="page-wrapper">
    <div class="container">
        <div class="row d-flex">
            {% if include.menu %}
            <div class="col-md-3 sidebar">
                {% include menu.html menu=include.menu %}
            </div>
            <div class="col-md-9 content-area px-3"> <!-- Added px-3 for horizontal padding -->
            {% else %}
            <div class="col-12 content-area px-3"> <!-- Added px-3 for horizontal padding -->
            {% endif %}
