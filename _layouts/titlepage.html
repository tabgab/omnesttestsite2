<!DOCTYPE html>
<html lang="en">
<head>
{% include head.html %}
{% include slideshow.html %}
</head>
<body>
{% if page.url == "/" or page.url == "/index.html" %}
  {% assign menu = nil %}
{% else %}
  {% assign menu = site.data.product_menu %}
{% endif %}
{% include titlepage_leadin.html menu=menu %}
<main id="main-content" class="animate-fade-in">
{{ content }}
</main>
{% include titlepage_leadout.html %}

<!-- Animation script -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    
    // Add animation classes to elements with delay
    const animateElements = document.querySelectorAll('.card, .hero-content h1, .hero-content p, .btn-group');
    animateElements.forEach((element, index) => {
      element.classList.add('animate-slide-up');
      element.classList.add(`delay-${(index + 1) * 100}`);
    });
  });
</script>
</body>
</html>
