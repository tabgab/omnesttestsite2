{% include titlepage_leadout.html %}

<!-- Mobile navigation toggle script -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const navToggle = document.querySelector('.navbar-toggle');
    const navMenu = document.querySelector('.navbar-nav');
    
    if (navToggle && navMenu) {
      navToggle.addEventListener('click', function() {
        navMenu.classList.toggle('active');
      });
    }
    
    // Add animation classes to elements with delay
    const animateElements = document.querySelectorAll('.card, .hero-content h1, .hero-content p, .btn-group');
    animateElements.forEach((element, index) => {
      element.classList.add('animate-slide-up');
      element.classList.add(`delay-${(index + 1) * 100}`);
    });
  });
</script>
</body>
</html>
